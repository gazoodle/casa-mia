configuration:
  house_name:
    name: House name
    description: Your home's name, shown over the house photo and on the guest welcome page.
  log_level:
    name: Log level
    description: How much the app logs.
  gitproxy_enabled:
    name: Serve tablet firmware
    description: "Beta. Mirror the Kiosk Satellite firmware and serve it to the tablets at http://<this host>:8000 (the Custom repository address in Kiosk Satellite)."
  compositor_enabled:
    name: Camera Commander
    description: >-
      Beta. The commanders, each a main camera framed by panels of cameras, drawn as one
      live picture by the compositor (served at http://<this host>:8099/) for the Camera
      Commander card and the dashboards. Set up on the Cameras and Camera Commander pages
      of the Casa Mia panel.
  camera_dashboard_enabled:
    name: Auto Dashboards
    description: >-
      In development. Dashboards made for you: today the camera dashboard, a page per commander
      and per camera, previewed and deployed into Home Assistant from the Auto
      Dashboards page of the Casa Mia panel. The commanders' pictures need Camera
      Commander on.
  guest_login_enabled:
    name: Guest login
    description: >-
      Beta. QR codes that sign guests and engineers into their own dashboard, served on port
      8675. Set up its logins and endpoints on the Guest login page of the Casa Mia panel
      (the sidebar, or Open web UI). Every endpoint is off until you switch it on.
  fona_enabled:
    name: Phone and SMS (FONA)
    description: >-
      Alpha. Calls and texts through the FONA GSM module (the Arduino on USB): a way to reach the
      house that needs no internet. Each is checked against the People page of the Casa
      Mia panel and passed to Home Assistant as authorised or intrusion.
  kiosks_enabled:
    name: Kiosk Satellites
    description: >-
      Alpha. Finds the Kiosk Satellite tablets (through Home Assistant's ESPHome devices and the
      tablets themselves), backs up their settings, and opens each one's admin page from
      the Casa Mia panel, from home or away.
  alarm_enabled:
    name: Alarm panel
    description: >-
      In development. The intruder alarm as a Home Assistant alarm panel (arm away, disarm, triggered),
      driven by the alarm's ESPHome sensors. It runs in the integration, which sets the
      code; off removes its device and entity.
  developer_mode:
    name: Developer mode
    description: >-
      Shows the debugging aids in the Casa Mia panel: the Settings page's developer
      options (the Tablet Layout's panel outlines and size label) and a commander's Debug
      options on the Camera Commander page. Off, the tablets show none of the Settings
      page's aids, whatever is saved there.
network:
  8000/tcp: "Firmware server (Serve tablet firmware): the tablets fetch Kiosk Satellite updates here. Blank it if that option is off."
  8099/tcp: "Camera composites (Compose camera groups): the tablets' camera images. Blank it if that option is off."
  8675/tcp: "Guest login: the address the QR codes point at. Blank it if that option is off."
