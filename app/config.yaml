name: Casa Mia
version: "2026.10.1-b19"
slug: casa_mia
description: "Casa Mia house services: phone and SMS (FONA), people, guest login, tablet firmware, Kiosk Satellites, camera composites."
url: "https://github.com/gazoodle/casa-mia"
# No `image:` key: the Supervisor builds ./Dockerfile on the box itself, so this ships
# without a registry. Only aarch64/amd64 are valid Supervisor architectures.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# The HA base image already runs s6-overlay as PID 1.
init: false

# The integration (in Core, a separate container) reaches the local API at
# `<repo-hash>-casa-mia:8780` on the Supervisor network, so no host port is published.
# `homeassistant_config` lets the app push its integrations into /config/custom_components.
# Port 8000 serves the tablet firmware (gitproxy module) to the kiosks on the LAN.
# Port 8099 serves the camera composites (compositor module); its config is in /config.
# Port 8098 serves the Camera Dashboard's draft composites, for its preview dashboard.
# Port 8675 serves the guest login QR endpoints (guest-login module); the integration
# enables and disables each endpoint through the local API on 8780.
# `uart` gives the fona module the Arduino's serial port, found by /dev/serial/by-id.
map:
  - homeassistant_config:rw
  - addon_config:rw
  - media:rw
homeassistant_api: true
hassio_api: true
uart: true
# The Casa Mia admin panel: the "Open web UI" button and the sidebar entry. Served by the
# local API on 8780, which answers the ingress gateway only for anything but /health.
ingress: true
ingress_port: 8780
panel_icon: mdi:home-heart
panel_title: Casa Mia
panel_admin: true
ports:
  8000/tcp: 8000
  8098/tcp: 8098
  8099/tcp: 8099
  8675/tcp: 8675

# Regenerable data lives under /data/cache and stays out of backups (see README).
# ponytail: glob syntax copied from other apps' manifests, check with a partial backup.
backup_exclude:
  - cache/*
  - firmware/*

options:
  house_name: Casa Mia
  log_level: info
  count_install: true
  gitproxy_enabled: false
  compositor_enabled: false
  camera_dashboard_enabled: false
  guest_login_enabled: false
  fona_enabled: false
  kiosks_enabled: false
  alarm_enabled: false
schema:
  house_name: str
  log_level: list(debug|info|warning|error)
  count_install: bool
  gitproxy_enabled: bool
  compositor_enabled: bool
  camera_dashboard_enabled: bool
  guest_login_enabled: bool
  fona_enabled: bool
  kiosks_enabled: bool
  alarm_enabled: bool
