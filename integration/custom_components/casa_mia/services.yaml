enable_for:
  target:
    entity:
      integration: casa_mia
      domain: switch
  fields:
    minutes:
      required: true
      example: 120
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
send_sms:
  fields:
    number:
      required: true
      example: "07700 900123"
      selector:
        text:
          type: tel
    message:
      required: true
      example: "Gates opening"
      selector:
        text:
          multiline: true
