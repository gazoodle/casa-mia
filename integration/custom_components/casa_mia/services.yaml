send_sms:
  fields:
    number:
      required: true
      example: "07700 900123"
      selector:
        text:
          type: tel
    message:
      required: true
      example: "Gates opening"
      selector:
        text:
          multiline: true
sensor_watch_list:
  fields:
    levels:
      example: ["warning", "error", "critical"]
      selector:
        select:
          multiple: true
          options:
            - nominal
            - task
            - warning
            - error
            - critical
    group:
      example: "Mains voltage"
      selector:
        text:
