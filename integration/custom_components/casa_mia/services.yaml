camera_picture:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: camera
    fresh:
      default: 5
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: s
check_plate:
  fields:
    plate:
      required: true
      example: "ZZ00 ZZZ"
      selector:
        text:
send_sms:
  fields:
    number:
      required: true
      example: "07700 900123"
      selector:
        text:
          type: tel
    message:
      required: true
      example: "Gates opening"
      selector:
        text:
          multiline: true
# Old names, passed on to casa_mia_sensor_watch.list and .refresh (sensor_watch.py).
sensor_watch_list: {}
sensor_watch_refresh: {}
