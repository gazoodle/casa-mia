name: Bug report
description: Something in Casa Mia doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Before you start: after an update, refresh the page (a page
        open since before it keeps running the old cards). And please take out anything private
        (names, phone numbers, addresses, tokens) from what you paste: issues are public.
  - type: dropdown
    id: module
    attributes:
      label: Which part?
      options:
        - Tablet Layout
        - Camera Commander card
        - Camera Dashboard
        - Camera compositor
        - Guest login
        - Kiosk Satellites
        - Kiosk mode
        - Firmware server
        - Phone and SMS (FONA)
        - Alarm panel
        - People
        - Dashboard helpers
        - The Casa Mia panel (home, Settings)
        - Installing or updating
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: The steps to make it happen, if you know them. Screenshots help.
    validations:
      required: true
  - type: input
    id: casa-mia
    attributes:
      label: Casa Mia version
      description: Settings → Apps → Casa Mia, at the top of its Info tab.
      placeholder: "2026.10.3"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      description: Settings → About.
      placeholder: "2026.9.4"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where you saw it
      description: The browser or app, and the device (a desktop browser, the Companion app, a wall tablet on Kiosk Satellite...).
  - type: textarea
    id: app-log
    attributes:
      label: The app's log
      description: Settings → Apps → Casa Mia → Log, the lines around the problem.
      render: text
  - type: textarea
    id: console
    attributes:
      label: The browser's console
      description: For the cards and the Tablet Layout. Lines starting CASA-MIA, and any errors in red.
      render: text
