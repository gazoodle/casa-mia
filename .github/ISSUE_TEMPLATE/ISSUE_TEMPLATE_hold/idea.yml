name: Idea
description: Something Casa Mia could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
      description: And what it would save you, or let you do. How you get by without it today helps too.
    validations:
      required: true
  - type: input
    id: part
    attributes:
      label: Which part, if any?
      placeholder: Tablet Layout, Guest login...
