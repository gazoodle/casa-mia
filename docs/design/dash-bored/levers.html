<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lever Frame</title>
<style>
:root { --wood: #5a3a22; --wood2: #3d2615; --brass: #c9a24b; --enamel: #f3efe2; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: "Gill Sans", "Gill Sans MT", "Johnston", Calibri, sans-serif; color: var(--enamel);
  background: repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 2px, transparent 2px 90px), linear-gradient(var(--wood), var(--wood2));
  padding: 22px 26px; display: grid; grid-template-rows: auto auto 1fr; gap: 18px; min-height: 100vh; }

/* ---------- the illuminated diagram ---------- */
.diagram { background: #0d0f0e; border: 10px solid #2a1a0e; border-radius: 6px; padding: 14px 20px 10px;
  box-shadow: inset 0 0 0 2px var(--brass), 0 10px 24px rgba(0,0,0,.5); }
.diagram h1 { margin: 0 0 6px; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; font-weight: 600; text-align: center; }
.diagram svg { display: block; width: 100%; height: auto; }
.track { stroke: var(--enamel); stroke-width: 5; fill: none; }
.section { stroke: #3a3a34; stroke-width: 11; stroke-linecap: round; transition: stroke .4s, filter .4s; }
.section.lit { stroke: #ffc233; filter: drop-shadow(0 0 7px #ffb300); }
.arm { transition: rotate .5s cubic-bezier(.3, 1.6, .5, 1); transform-box: fill-box; transform-origin: 0% 50%; }
.clear .arm { rotate: -45deg; }
.lamp { fill: #7a1410; transition: fill .3s; } .clear .lamp { fill: #2ee66b; filter: drop-shadow(0 0 4px #2ee66b); }
svg text { fill: var(--enamel); font-size: 12px; letter-spacing: .18em; text-anchor: middle; text-transform: uppercase; }
svg text.small { font-size: 9px; letter-spacing: .1em; }

/* ---------- block instruments: one per room, for its temperature ---------- */
.blocks { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
.block { background: linear-gradient(#6b4527, #4a2e18); border-radius: 60px 60px 6px 6px; padding: 10px 8px 6px; text-align: center;
  box-shadow: inset 0 0 0 2px #2a1a0e, 0 6px 12px rgba(0,0,0,.4); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.block svg { width: 96px; height: 58px; display: block; margin: 0 auto 2px; overflow: visible; }
.needle { transition: rotate 1s cubic-bezier(.3, 1.4, .5, 1); transform-origin: 48px 54px; }

/* ---------- the frame ---------- */
.frame { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 10px 0;
  border-bottom: 16px solid #1d1d1d; box-shadow: 0 6px 0 #000; perspective: 700px; }
.group { text-align: center; }
.group > span { display: block; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 44px; opacity: .85; }
.group > div { display: flex; gap: 7px; }
.lever { all: unset; cursor: pointer; width: 46px; display: flex; flex-direction: column; align-items: center; }
/* Normal: the lever leans away from you. Reversed: it comes over towards you, with a clunk. */
.lever .rod { width: 14px; height: 190px; border-radius: 7px 7px 0 0; transform-origin: bottom; transform: perspective(420px) rotateX(38deg);
  transition: transform .45s cubic-bezier(.3, 1.7, .5, 1); position: relative;
  background: linear-gradient(90deg, rgba(255,255,255,.35), transparent 40%, rgba(0,0,0,.35)), var(--c); }
.lever .rod::before { content: ""; position: absolute; left: -3px; top: -4px; width: 20px; height: 46px; border-radius: 9px;
  background: linear-gradient(90deg, #f1f1f1, #9a9a9a 50%, #6c6c6c); }
.lever .rod::after { content: ""; position: absolute; left: 14px; top: 34px; width: 7px; height: 70px; border-radius: 3px; background: #8d8d8d; }
.lever.on .rod { transform: perspective(420px) rotateX(-34deg); filter: brightness(1.15); }
.lever .plate { width: 44px; margin-top: 4px; padding: 3px 0; border-radius: 3px; text-align: center; font-size: 8.5px; line-height: 1.25;
  color: #2a1a0e; background: linear-gradient(#e8cf8a, var(--brass)); letter-spacing: .04em; text-transform: uppercase; }
.lever .plate b { display: block; font-size: 14px; }
.lever:focus-visible .plate { outline: 2px solid #fff; }
.bells { display: flex; gap: 10px; justify-content: center; }
.bells button { all: unset; cursor: pointer; padding: 7px 16px; border-radius: 20px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
  color: #2a1a0e; background: radial-gradient(circle at 30% 25%, #f7e6a6, var(--brass)); box-shadow: 0 4px 0 #6f5620; }
.bells button:active { translate: 0 3px; box-shadow: 0 1px 0 #6f5620; }
@media (max-width: 900px) { .frame { flex-wrap: wrap; gap: 20px; } .blocks { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<div class="diagram"><h1>Casa Mia Signal Box · Illuminated Diagram</h1><svg id="diagram" viewBox="0 0 1200 120"></svg></div>
<div><div class="blocks" id="blocks"></div><br><div class="bells" id="bells"></div></div>
<div class="frame" id="frame"></div>

<script src="house.js"></script>
<script>
// Lever colours, after railway practice: red for signals, blue for locks, and so on.
const COLOUR = { light: "#c8281e", switch: "#1f4fa8", cover: "#e2b41f", lock: "#151515" };
const span = 1200 / House.rooms.length;

document.getElementById("diagram").innerHTML = `<path class="track" d="M10,78 H1190"/>` + House.rooms.map((r, i) => {
  const x = i * span + span / 2;
  return `<g data-room="${r.id}"><path class="section" d="M${x - span / 2 + 22},78 H${x + span / 2 - 22}"/>
    <path class="track" stroke-width="2" d="M${x - span / 2},70 V86"/>
    <path d="M${x - 40},60 V22" stroke="#f3efe2" stroke-width="3"/>
    <rect class="arm" x="${x - 40}" y="20" width="34" height="9" fill="#c8281e" stroke="#f3efe2"/>
    <circle class="lamp" cx="${x - 40}" cy="40" r="5"/>
    <text x="${x + 18}" y="38">${r.name}</text><text class="small" x="${x + 18}" y="54"></text></g>`;
}).join("");

document.getElementById("blocks").innerHTML = House.rooms.map((r) => `<div class="block">
  <svg viewBox="0 0 96 58"><path d="M6,54 A42,42 0 0 1 90,54 Z" fill="#f3efe2" stroke="#2a1a0e" stroke-width="2"/>
    <path d="M6,54 A42,42 0 0 1 27,17.6 L48,54Z" fill="#9fc3e8"/><path d="M69,17.6 A42,42 0 0 1 90,54 L48,54Z" fill="#e59a8b"/>
    <text x="22" y="46" style="fill:#2a1a0e;font-size:6px">COLD</text><text x="48" y="24" style="fill:#2a1a0e;font-size:6px">RIGHT</text>
    <text x="74" y="46" style="fill:#2a1a0e;font-size:6px">WARM</text>
    <path class="needle" d="M47,54 L48,16 L49,54Z" fill="#111" style="rotate:${Math.max(-80, Math.min(80, (r.temp - r.target) * 30))}deg"/>
    <circle cx="48" cy="54" r="4" fill="#c9a24b"/></svg>${r.name} ${r.temp.toFixed(1)}°</div>`).join("");

let n = 0;
document.getElementById("frame").innerHTML = House.rooms.map((r) => `<div class="group"><span>${r.name}</span><div>${
  r.devices.map((d) => `<button class="lever" data-id="${d.id}" style="--c:${COLOUR[d.kind]}" aria-label="${r.name} ${d.name}">
    <i class="rod"></i><span class="plate"><b>${++n}</b>${d.name.split(" ")[0]}</span></button>`).join("")}</div></div>`).join("");
document.getElementById("frame").onclick = (e) => { const l = e.target.closest(".lever"); if (l) House.toggle(l.dataset.id); };

document.getElementById("bells").innerHTML = House.scenes.map((s) => `<button data-scene="${s.id}">${s.name}</button>`).join("");
document.getElementById("bells").onclick = (e) => e.target.dataset.scene && House.scene(e.target.dataset.scene);

function paint() {
  for (const d of House.devices) document.querySelector(`[data-id="${d.id}"]`).classList.toggle("on", d.on);
  for (const r of House.rooms) {
    const g = document.querySelector(`[data-room="${r.id}"]`), lit = House.lightsOn(r);
    g.classList.toggle("clear", lit > 0);
    g.querySelector(".section").classList.toggle("lit", lit > 0);
    g.querySelector(".small").textContent = lit ? `${lit} lit` : "dark";
  }
}
House.on(paint);
paint();
</script>
</body>
</html>
