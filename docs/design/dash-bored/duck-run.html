<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contraption: the Kitchen, by duck</title>
<link rel="stylesheet" href="waterworks/style.css">
<style>
/* A sleeping duck says so: shown while there is no data. */
.ink .zz { opacity: 0; transition: opacity 1s; font-style: italic; }
.stale .ink .zz { opacity: 1; }
.ink [data-p="honk"] { font-style: italic; }
/* The slider for how big a tile is drawn. Bigger than the screen, the drawing scrolls. */
/* The sheet is the shape of the room's route (`--shape`, main.js) and fits the screen. */
#stage { overflow: auto; container-type: size; }
.sheet { margin: 0 auto; min-width: 0; height: auto; aspect-ratio: var(--shape); width: min(100cqw, 100cqh * var(--shape)); }
#rooms { display: flex; gap: 10px; font-size: 13px; }
#rooms a { color: inherit; }
#rooms a[aria-current] { font-weight: bold; text-decoration: none; }
/* The far view: the machinery as one bitmap, in place of the drawing of it (main.js). */
.sheet canvas.farmap { display: none; }
.sheet.far canvas.farmap { display: block; }
.sheet.far .wob, .sheet.far [data-live], .sheet.far canvas[data-turn] { display: none !important; }
/* Something working loose shakes until the bot has seen to it. */
.jitter { animation: jitter .12s linear infinite alternate; }
@keyframes jitter { from { translate: -1.5px 0; } to { translate: 1.5px 1px; } }
.stale .jitter { animation-play-state: paused; }
@media (prefers-reduced-motion: reduce) { .jitter { animation: none; } }
/* What lights up in a lamp: the opacity is set on the group. */
.ink .shine { opacity: 0; }
.ink .shine * { stroke: none; fill: var(--lit); }
#size { display: flex; align-items: center; gap: 6px; font-size: 13px; }
#size input { accent-color: var(--line); width: 140px; }
#size output { min-width: 4.5em; }
#rate { font-size: 12px; opacity: .8; }
/* A device that is not answering: its machine under a sheet, and a tube for the ducks. */
.broken { display: none; }
.broken.is { display: inline; animation: drape .45s ease-out; }
@keyframes drape { from { translate: 0 -60px; opacity: 0; } }
.ink .tube { stroke-width: 26; stroke-linecap: butt; }
.ink .bore { stroke: var(--paper); stroke-width: 21; stroke-linecap: butt; }
</style>
</head>
<body>
<svg class="grain"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3"/>
  <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .15  0 0 0 .5 0"/></filter>
  <rect width="100%" height="100%" filter="url(#grain)"/></svg>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="wobble" x="-2%" y="-2%" width="104%" height="104%">
    <feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="4"/>
    <feDisplacementMap in="SourceGraphic" scale="3"/></filter>
  <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
    <rect width="5" height="5" fill="#eadcbc"/><line y2="5" stroke="#2b2118" stroke-width="1"/></pattern>
  <pattern id="cross" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="4" height="4" fill="#eadcbc"/><path d="M0,0 V4 M0,0 H4" stroke="#2b2118" stroke-width=".9"/></pattern>
  <pattern id="blue" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="6" height="6" fill="#1d4f91"/><line y2="6" stroke="#e8f1ff" stroke-width=".7"/></pattern>
</defs></svg>

<header>
  <h1>The Kitchen, by duck</h1>
  <p>The ducks go through every device in turn and are its engine. Tap a device to throw its clutch. The dashed cords are for trying the works.</p>
  <nav id="rooms" aria-label="Rooms"></nav>
  <label id="size">Tile size <input type="range" min="100" max="520" step="10"> <output></output></label>
  <output id="rate"></output>
  <div id="skins"></div>
  <div class="cords" id="cords"></div>
</header>
<p class="notice" id="notice" role="status"></p>
<main id="stage"></main>

<script>
// Each script is asked for afresh. Safari on the iPad kept an old copy of one of them
// beside new copies of the rest (2026-11-18), and the page it made of the mixture was
// wrong in a way that looked like a fault in the drawing.
for (const src of ["house.js", "contraption/kit.js", "contraption/house.js", "waterworks/room.js", "waterworks/bot.js", "waterworks/bake.js", "waterworks/page.js", "duck-run/tile.js", "duck-run/carriers.js", "duck-run/light.js", "duck-run/group.js", "duck-run/devices.js", "duck-run/layout.js", "duck-run/rooms.js", "duck-run/faults.js", "duck-run/main.js"]) document.write(`<script src="${src}?${Date.now()}"><\/script>`);
</script>
</body>
</html>
