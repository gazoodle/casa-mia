<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contraption</title>
<style>
:root { --paper: #eadcbc; --ink: #2b2118; --wash: #c9a86a; --glow: #f2c84b; --red: #a8452f; --label: #f3ead3; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  color: var(--ink); background: var(--paper);
  font-family: "Bradley Hand", "Segoe Print", "Chalkboard SE", cursive;
  padding: 14px 20px 30px;
}
/* Foxed paper: grain over everything, darker towards the edges. */
.grain { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .5; mix-blend-mode: multiply; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(110,70,20,.35)); }

header { display: flex; align-items: flex-end; gap: 20px; padding: 0 6px 10px; }
h1 { font: 400 32px/1 "Snell Roundhand", "Apple Chancery", "Lucida Calligraphy", cursive; margin: 0; }
header p { margin: 0 0 4px; font-size: 13.5px; font-style: italic; flex: 1; min-width: 200px; }
.cords { display: flex; gap: 14px; align-items: flex-start; }
.cords .gap { width: 14px; }
.cord { all: unset; cursor: pointer; text-align: center; font-size: 13px; transform-origin: top center; }
.cord::before { content: ""; display: block; width: 2px; height: 22px; margin: 0 auto; background: var(--ink); }
.cord::after { content: ""; display: block; width: 12px; height: 18px; margin: 0 auto 2px;
  border: 2px solid var(--ink); border-radius: 3px 3px 8px 8px; background: var(--red); }
.cord.try::after { background: var(--paper); border-style: dashed; }
.cord span { display: block; max-width: 62px; line-height: 1.1; }
.cord.pulled { animation: tug .7s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes tug { 30% { translate: 0 14px; } 60% { rotate: 5deg; } 80% { rotate: -3deg; } }
.cord:focus-visible, .hot:focus-visible { outline: 2px dashed var(--ink); outline-offset: 3px; }

.plant { display: grid; grid-template-columns: 190px 1fr; gap: 30px; align-items: start; }
#engine { position: sticky; top: 8px; }
/* The works hold the bot, which is placed within them; the line down their left is its pole. */
#works { position: relative; }
#works::before { content: ""; position: absolute; left: -17px; top: 10px; bottom: 14px; width: 3px; background: var(--ink); border-radius: 2px; }
/* The marbles' way home: a pipe down the left that the gutters run into, and at each bay a
   sump with a gate over it, hinged on the pipe (marbles.js places and swings them). */
#works::after { content: ""; position: absolute; left: -9px; top: 24px; bottom: 30px; width: 2px; background: var(--ink); opacity: .7; }
.sump { position: absolute; left: -34px; width: 28px; height: 16px; border: 2px solid var(--ink); border-top: 0; border-radius: 0 0 9px 9px; background: var(--paper); }
.gate { position: absolute; left: -7px; width: 3px; height: 18px; background: var(--ink); border-radius: 2px; transform-origin: 50% 0; }
.marble { position: absolute; left: 0; top: 0; z-index: 1; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); opacity: 0; pointer-events: none; }
/* The scene rod jerks along every bay as a pin on the barrel catches it. */
.jerk [data-rod] { animation: jerk .16s; }
@keyframes jerk { 50% { translate: 6px 0; } }
.bay { display: flex; flex-wrap: wrap; margin-bottom: 8px; }
/* Drawn 200 wide (a sign 140) and shown a little smaller, so that five devices and their
   room's sign fit across a wall tablet. */
.cell { position: relative; margin: 0; width: 186px; }
.cell.sign { width: 130px; }
.cell svg { width: 100%; height: auto; }
.bot { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; will-change: transform; }

svg { display: block; overflow: visible; }
/* The wobble that makes a ruled line look drawn by hand. machine.js swaps its seed so
   the lines "boil" slightly, as in hand-drawn animation. */
.ink { filter: url(#wobble); }
.plain .ink { filter: none; }
.ink * { stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.ink .fill { fill: var(--paper); }
.ink .solid { fill: var(--ink); }
.ink .hatch { fill: url(#hatch); }
.ink .wash { stroke: none; fill: var(--wash); opacity: .4; }
.ink .glow { stroke: none; fill: var(--glow); }
.ink .flame { fill: #e98a2b; }
.ink .thin { stroke-width: 1; }
.ink .board { fill: #dcc694; }
.ink .glass { fill-opacity: .5; }
.ink .hit { stroke: none; fill: transparent; }
.ink .web { display: none; }
.ink text { stroke: none; fill: var(--ink); font-size: 9px; }
.ink [data-p="lid"] { pointer-events: none; }
.hot { cursor: pointer; }
.hot[data-act="crank"] { cursor: ew-resize; touch-action: none; }
.hot:hover .knob { fill: var(--red); }
.puff { transform-box: fill-box; transform-origin: center; animation: puff 2.4s ease-out infinite; opacity: 0; }
@keyframes puff { 0% { opacity: .8; translate: 0 0; scale: .5; } 100% { opacity: 0; translate: 10px -34px; scale: 1.6; } }
.flick { transform-box: fill-box; transform-origin: bottom center; animation: flick .28s ease-in-out infinite alternate; }
@keyframes flick { to { scale: .86 1.12; } }
.run { stroke-dasharray: 5 4; animation: run .4s linear infinite; }
@keyframes run { to { stroke-dashoffset: -9; } }

.fig { font-size: 12px; margin: 0; padding: 2px 6px 8px; text-align: center; line-height: 1.25; overflow-wrap: anywhere; }
.fig i { display: block; font-size: 11px; opacity: .8; }
#engine .fig { padding-bottom: 5px; }

/* Out of order: a luggage label with how long, a cobweb, and nothing answers. */
.tag { display: none; position: absolute; left: 38px; top: 64px; rotate: -7deg; padding: 4px 9px; font-size: 13px;
  background: var(--label); border: 2px solid var(--ink); border-radius: 3px; max-width: 150px; text-align: center; }
.away .tag { display: block; }
.away svg { opacity: .4; }
.away .ink .web { display: inline; }
.nope { animation: nope .35s; }
@keyframes nope { 25% { translate: -4px 0; } 75% { translate: 4px 0; } }

/* What Sensor Watch is saying, on luggage labels; and the notice when the data stops. */
.labels { list-style: none; margin: 4px 0 0; padding: 0; }
.labels li { margin: 0 6px 6px; padding: 4px 8px; font-size: 13px; background: var(--label); border: 2px solid var(--ink);
  border-radius: 3px 12px 12px 3px; rotate: -2deg; }
.labels i { display: block; font-size: 11px; }
.notice:empty { display: none; }
.notice { margin: 6px; padding: 6px 8px; font-size: 14px; background: var(--red); color: var(--label); border: 2px solid var(--ink); }
.stale #works { opacity: .45; }
.stale #works .flick, .stale #works .puff, .stale #works .run { animation-play-state: paused; }

@media (prefers-reduced-motion: reduce) { .puff, .flick, .run { animation: none; } }
@media (max-width: 900px) {
  header { flex-wrap: wrap; }
  .plant { grid-template-columns: 1fr; }
  #engine { position: static; }
}
</style>
</head>
<body>
<svg class="grain"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3"/>
  <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .15  0 0 0 .5 0"/></filter>
  <rect width="100%" height="100%" filter="url(#grain)"/></svg>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence id="boil" type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="4"/>
    <feDisplacementMap in="SourceGraphic" scale="3"/></filter>
  <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
    <rect width="5" height="5" fill="#eadcbc"/><line y2="5" stroke="#2b2118" stroke-width="1"/></pattern>
</defs></svg>

<header>
  <h1>The Casa Mia Patent Domestic Apparatus</h1>
  <p>for the management of a household without rising from one's chair. Pull a lever, turn a crank, or lift the glass and then pull. The dashed cords are for trying the works.</p>
  <div class="cords" id="cords"></div>
</header>
<div class="plant">
  <aside id="engine"></aside>
  <main id="works"></main>
</div>

<script>
// "?plain" draws it without the wobble, to measure what the wobble costs on a tablet.
if (location.search.includes("plain")) document.body.classList.add("plain");
</script>
<script src="house.js"></script>
<script src="contraption/kit.js"></script>
<script src="contraption/house.js"></script>
<script src="contraption/links.js"></script>
<script src="contraption/effects.js"></script>
<script src="contraption/engine.js"></script>
<script src="contraption/marbles.js"></script>
<script src="contraption/bot.js"></script>
<script src="contraption/machine.js"></script>
</body>
</html>
