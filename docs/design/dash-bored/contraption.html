<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contraption</title>
<style>
@property --open { syntax: "<number>"; inherits: true; initial-value: 0; }
:root { --paper: #eadcbc; --ink: #2b2118; --wash: #c9a86a; --sky: #9fb7b3; --glow: #f2c84b; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  color: var(--ink); background: var(--paper);
  font-family: "Bradley Hand", "Segoe Print", "Chalkboard SE", cursive;
  padding: 14px 20px 20px;
}
/* Foxed paper: grain over everything, darker towards the edges. */
.grain { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .5; mix-blend-mode: multiply; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(110,70,20,.35)); }

header { display: flex; align-items: flex-end; gap: 24px; padding: 0 6px 4px; }
h1 { font: 400 34px/1 "Snell Roundhand", "Apple Chancery", "Lucida Calligraphy", cursive; margin: 0; }
header p { margin: 0 0 4px; font-size: 14px; font-style: italic; flex: 1; }
.cords { display: flex; gap: 18px; align-items: flex-start; }
.cord { all: unset; cursor: pointer; text-align: center; font-size: 13px; transform-origin: top center; }
.cord::before { content: ""; display: block; width: 2px; height: 26px; margin: 0 auto; background: var(--ink); }
.cord::after { content: ""; display: block; width: 12px; height: 18px; margin: 0 auto 2px;
  border: 2px solid var(--ink); border-radius: 3px 3px 8px 8px; background: #a8452f; }
.cord span { display: block; }
.cord.pulled { animation: tug .7s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes tug { 30% { translate: 0 14px; } 60% { rotate: 5deg; } 80% { rotate: -3deg; } }

main { display: grid; grid-template-columns: 200px repeat(6, 1fr); }
svg { display: block; width: 100%; height: auto; overflow: visible; }
/* The wobble that makes a ruled line look drawn by hand. script swaps its seed so the
   lines "boil" slightly, as in hand-drawn animation. */
.ink { filter: url(#wobble); }
.ink * { stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; fill: none; vector-effect: non-scaling-stroke; }
.ink .fill { fill: var(--paper); }
.ink .solid { fill: var(--ink); }
.ink .hatch { fill: url(#hatch); }
.ink .wash { stroke: none; fill: var(--wash); opacity: .45; }
.ink .glow { stroke: none; fill: var(--glow); }
.ink .flame { fill: #e98a2b; }
.ink .thin { stroke-width: 1; }
.ink .hit { stroke: none; fill: transparent; }
.ink text { stroke: none; fill: var(--ink); font-size: 9px; }
.spin { transform-box: fill-box; transform-origin: center; animation: spin var(--t, 5s) linear infinite; }
@keyframes spin { to { rotate: 1turn; } }
.puff { animation: puff 2.4s ease-out infinite; opacity: 0; }
@keyframes puff { 0% { opacity: .8; translate: 0 0; scale: .5; } 100% { opacity: 0; translate: 14px -46px; scale: 1.6; } }
.flick { transform-box: fill-box; transform-origin: bottom center; animation: flick .28s ease-in-out infinite alternate; }
@keyframes flick { to { scale: .86 1.12; } }
.lever { cursor: pointer; }
.lever:hover .knob { fill: #a8452f; }

.station { text-align: center; }
.fig { font-size: 12px; margin: -6px 0 0; }
.fig i { display: block; font-size: 11.5px; opacity: .8; }

/* The room's particulars: a crank cog walks a notched stick down, and the paper follows. */
.detail { display: grid; grid-template-columns: 34px 1fr; margin: 4px 6px 0; --open: 0;
  transition: --open 1.2s cubic-bezier(.45, 0, .3, 1); text-align: left; }
.detail.open { --open: 1; }
.sign { all: unset; cursor: pointer; grid-column: 1 / 3; text-align: center; font-size: 17px; padding: 3px 0 2px;
  border: 2px solid var(--ink); border-radius: 3px; background: #dcc694; filter: url(#wobble); }
.sign:focus-visible, .lever:focus-visible, .cord:focus-visible { outline: 2px dashed var(--ink); outline-offset: 3px; }
.winder { position: relative; overflow: hidden; }
.winder .cog { position: absolute; top: 2px; left: 0; width: 26px; rotate: calc(var(--open) * -1.5turn); }
.winder .stick { position: absolute; left: 24px; bottom: 0; width: 8px; height: 150px; }
.paper { height: calc(var(--open) * 118px); overflow: hidden; }
.paper ul { list-style: none; margin: 0; padding: 6px 8px; height: 118px; font-size: 13px; line-height: 1.5;
  border: 2px solid var(--ink); border-top: 0; background: #f3ead3; filter: url(#wobble);
  border-radius: 0 0 14px 3px; }
.paper li { cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.paper li::before { content: "☐ "; }
.paper li.on::before { content: "☒ "; }
.paper li.temp { cursor: default; font-style: italic; }
.paper li.temp::before { content: ""; }
@media (prefers-reduced-motion: reduce) { .spin, .puff, .flick { animation: none; } .detail { transition: none; } }
@media (max-width: 900px) { main { grid-template-columns: repeat(2, 1fr); } header { flex-wrap: wrap; } }
</style>
</head>
<body>
<svg class="grain"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3"/>
  <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .15  0 0 0 .5 0"/></filter>
  <rect width="100%" height="100%" filter="url(#grain)"/></svg>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence id="boil" type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="4"/>
    <feDisplacementMap in="SourceGraphic" scale="3.4"/></filter>
  <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
    <rect width="5" height="5" fill="#eadcbc"/><line y2="5" stroke="#2b2118" stroke-width="1"/></pattern>
</defs></svg>

<header>
  <h1>The Casa Mia Patent Domestic Apparatus</h1>
  <p>for the lighting of rooms without rising from one's chair. Pull a lever to light a room, or its name for the particulars.</p>
  <div class="cords" id="cords"></div>
</header>
<main id="main"></main>

<script src="house.js"></script>
<script>
// Each weight is drawn hanging from (0,0), and doubles as the snuffer over its candle.
const WEIGHTS = [
  { how: "the raising of the boot",
    art: `<path class="fill" d="M-9,8 h15 v18 q15,1 19,9 q1,5 -3,6 h-31 z"/><path d="M-9,36 h31 M-5,14 h7 M-5,19 h7"/>` },
  { how: "lifting a flat iron",
    art: `<path class="hatch" d="M-20,40 q2,-17 22,-17 h17 v17 z"/><path d="M-9,23 q9,-15 21,0"/>` },
  { how: "hoisting the second-best teapot",
    art: `<ellipse class="fill" cx="0" cy="30" rx="16" ry="11"/><path d="M15,28 q10,-2 12,-11 M-15,25 q-11,4 -3,12 M-8,19 h16"/><circle class="solid" cx="0" cy="16" r="2"/>` },
  { how: "the ascent of a common brick",
    art: `<rect class="hatch" x="-19" y="16" width="38" height="24"/><text x="-13" y="32" class="lab">BRICK</text>` },
  { how: "a kipper (renew weekly)",
    art: `<path class="fill" d="M-21,28 q15,-15 31,0 q-16,15 -31,0 z"/><path class="fill" d="M10,28 l11,-9 v18 z"/><circle class="solid" cx="-13" cy="26" r="1.4"/><path class="thin" d="M-6,22 q4,6 0,12 M0,21 q4,7 0,14"/>` },
  { how: "elevating a small anvil",
    art: `<path class="hatch" d="M-21,14 h37 q6,0 8,5 h-14 q-2,10 4,14 v7 h-31 v-7 q6,-4 4,-14 h-8 z"/>` },
];

const wheel = (x, y, r, t) => `<g transform="translate(${x},${y})"><g class="spin" style="--t:${t}s">
  <circle class="fill" r="${r}"/><path d="M${-r},0 H${r} M0,${-r} V${r}"/><circle class="solid" r="2.2"/></g></g>`;

// ---------- the motive power ----------
const avg = House.rooms.slice(0, 5).reduce((s, r) => s + r.temp, 0) / 5;
const engine = document.createElement("section");
engine.className = "station";
engine.innerHTML = `<svg viewBox="0 0 200 400" class="ink">
  <ellipse class="wash" cx="92" cy="300" rx="78" ry="52"/>
  <path d="M0,19 H200 M0,25 H200"/><path d="M150,0 V14 M162,0 V14"/>
  <path class="thin" d="M134,22 L113,250 M178,22 L195,250"/>
  ${wheel(156, 22, 22, 3)}${wheel(154, 250, 41, 3)}
  <path d="M154,250 L96,292"/><circle class="solid" cx="96" cy="292" r="3"/>
  <path d="M154,291 V362 M134,362 H176"/>
  <!-- the kettle, its stove and its steam -->
  <circle class="puff fill" cx="118" cy="252" r="7"/><circle class="puff fill" cx="118" cy="252" r="7" style="animation-delay:.8s"/>
  <circle class="puff fill" cx="118" cy="252" r="7" style="animation-delay:1.6s"/>
  <path class="fill" d="M34,318 q-4,-46 38,-46 q42,0 38,46 z"/><path d="M106,296 q14,-6 12,-38 M40,290 q-24,6 -8,26 M56,272 q16,-12 32,0"/>
  <circle class="solid" cx="72" cy="263" r="3"/>
  <path class="hatch" d="M26,318 h92 v10 h-92 z"/><path d="M36,328 v34 M108,328 v34"/>
  <path class="flame flick" d="M56,356 q-8,-12 2,-22 q8,10 -2,22 z"/><path class="flame flick" d="M72,356 q-8,-14 2,-26 q8,12 -2,26 z" style="animation-delay:.1s"/>
  <path class="flame flick" d="M88,356 q-8,-12 2,-22 q8,10 -2,22 z" style="animation-delay:.2s"/>
  <!-- the thermometer: the house's average -->
  <rect class="fill" x="14" y="150" width="9" height="92" rx="4.5"/><circle class="solid" cx="18.5" cy="246" r="7.5"/>
  <rect class="solid" x="16.5" y="${240 - (avg - 10) * 5}" width="4" height="${(avg - 10) * 5}"/>
  <path class="thin" d="M26,160 h6 M26,180 h6 M26,200 h6 M26,220 h6"/><text x="34" y="163">30</text><text x="34" y="203">20</text>
  <path d="M4,362 H196"/><path class="thin" d="M10,368 l8,-6 M30,368 l8,-6 M120,368 l8,-6 M170,368 l8,-6"/>
  </svg><p class="fig">Fig. 1. The motive power<i>a kettle, kept at ${avg.toFixed(1)}°</i></p>`;
document.getElementById("main").append(engine);

// ---------- one station per room ----------
const PIVOT = { x: 26, y: 296 }, PULLEY = { x: 95, y: 96, r: 13 }, HOOK_OFF = 282, LAMP = { x: 108, y: 352 };
const stations = House.rooms.map((room, i) => {
  const lamp = House.lights(room)[0], w = WEIGHTS[i];
  const el = document.createElement("section");
  el.className = "station";
  el.innerHTML = `<svg viewBox="0 0 190 400" class="ink">
    <ellipse class="wash" cx="100" cy="345" rx="76" ry="26"/>
    <path d="M0,19 H190 M0,25 H190"/><path d="M60,0 V14 M72,0 V14"/>
    ${wheel(95, 22, 15, 2.2)}
    <path class="thin" d="M81,22 L83,${PULLEY.y} M109,22 L107,${PULLEY.y}"/>
    ${i === 2 ? `<path class="fill" d="M150,12 q8,-10 16,0 q-8,7 -16,0 z"/><path d="M166,10 l6,2 l-6,2 M156,17 v4 M160,17 v4"/><circle class="solid" cx="162" cy="9" r="1"/>` : ""}
    <circle class="glow" data-part="glow" cx="${LAMP.x}" cy="312" r="50"/>
    <path data-part="rays" d="M108,268 v-14 M134,282 l10,-10 M82,282 l-10,-10 M146,308 h13 M70,308 h-13"/>
    <!-- candle and holder -->
    <path class="fill" d="M104,${LAMP.y} v-28 h8 v28 z"/><path d="M108,324 v-5"/>
    <path class="flame flick" data-part="flame" d="M108,319 q-7,-9 0,-18 q7,9 0,18 z"/>
    <path class="hatch" d="M92,${LAMP.y} h32 l-5,8 h-22 z"/>
    <path data-part="rope"/>
    <g data-part="weight"><path d="M0,0 v9"/>${w.art}</g>
    <g transform="translate(${PULLEY.x},${PULLEY.y})"><g data-part="pulley"><circle class="fill" r="${PULLEY.r}"/><path d="M-13,0 H13 M0,-13 V13"/></g><circle class="solid" r="2.2"/></g>
    <!-- the lever on its post -->
    <path d="M${PIVOT.x},${PIVOT.y} V362 M${PIVOT.x - 12},362 H${PIVOT.x + 12}"/>
    <g class="lever" tabindex="0" role="button" aria-label="${room.name}: ${lamp.name}">
      <g data-part="arm"><path d="M0,0 H58" stroke-width="3"/><circle class="knob solid" cx="62" r="6"/><rect class="hit" x="-10" y="-22" width="90" height="44"/></g></g>
    <circle class="solid" cx="${PIVOT.x}" cy="${PIVOT.y}" r="3"/>
    <path d="M2,362 H188"/><path class="thin" d="M60,368 l8,-6 M140,368 l8,-6 M166,368 l8,-6"/>
    </svg>
    <p class="fig">Fig. ${i + 2}. ${lamp.name}<i>lit by ${w.how}</i></p>
    <div class="detail"><button class="sign">${room.name}</button>
      <div class="winder"><svg class="stick ink" viewBox="0 0 8 150" preserveAspectRatio="none">
          <path class="fill" d="M2,0 V150 H7 V0 Z M2,8 h-2 M2,20 h-2 M2,32 h-2 M2,44 h-2 M2,56 h-2 M2,68 h-2 M2,80 h-2 M2,92 h-2 M2,104 h-2 M2,116 h-2 M2,128 h-2 M2,140 h-2"/></svg>
        <svg class="cog ink" viewBox="-14 -14 28 28"><circle class="fill" r="9"/>
          <path d="M0,-9 V-13 M0,9 V13 M-9,0 H-13 M9,0 H13 M6.4,6.4 l3,3 M-6.4,6.4 l-3,3 M6.4,-6.4 l3,-3 M-6.4,-6.4 l-3,-3 M0,0 L6,-3"/><circle class="solid" r="1.6"/></svg></div>
      <div class="paper"><ul></ul></div></div>`;
  document.getElementById("main").append(el);

  const part = (name) => el.querySelector(`[data-part="${name}"]`);
  const lever = el.querySelector(".lever");
  lever.onclick = () => House.toggle(lamp.id);
  lever.onkeydown = (e) => (e.key === "Enter" || e.key === " ") && House.toggle(lamp.id);
  el.querySelector(".sign").onclick = () => el.querySelector(".detail").classList.toggle("open");
  el.querySelector("ul").onclick = (e) => e.target.dataset.id && House.toggle(e.target.dataset.id);
  return { room, lamp, el, part, t: lamp.on ? 1 : 0, v: 0 };
});

// Where the rope leaves the lever, for a lever angle in degrees.
const grip = (deg) => ({ x: PIVOT.x + 42 * Math.cos(deg * Math.PI / 180), y: PIVOT.y + 42 * Math.sin(deg * Math.PI / 180) });
const reach = (g) => Math.hypot(g.x - (PULLEY.x - PULLEY.r), g.y - PULLEY.y);
const SLACK = reach(grip(-38));

// Draw a station with its lever a fraction `t` of the way down. The rope's length is
// fixed, so whatever the lever takes up on its side lifts the weight on the other.
function draw(s) {
  const deg = -38 + 70 * s.t, g = grip(deg), rise = reach(g) - SLACK, hook = HOOK_OFF - rise;
  s.part("arm").setAttribute("transform", `translate(${PIVOT.x},${PIVOT.y}) rotate(${deg})`);
  s.part("weight").setAttribute("transform", `translate(${LAMP.x},${hook})`);
  s.part("pulley").setAttribute("transform", `rotate(${(rise / PULLEY.r) * -57.3})`);
  s.part("rope").setAttribute("d", `M${g.x},${g.y} L${PULLEY.x - PULLEY.r},${PULLEY.y}
    A${PULLEY.r},${PULLEY.r} 0 0 1 ${PULLEY.x + PULLEY.r},${PULLEY.y} L${LAMP.x},${hook}`);
  const lit = Math.max(0, Math.min(1, s.t));
  s.part("glow").style.opacity = lit * 0.55;
  s.part("rays").style.opacity = lit;
  s.part("flame").style.opacity = lit;
}

// A soft spring, so the weight overshoots and settles like something on a rope.
let running = false;
function animate() {
  let busy = false, dt = 1 / 60;
  for (const s of stations) {
    const target = s.lamp.on ? 1 : 0;
    s.v += ((target - s.t) * 70 - s.v * 9) * dt;
    s.t += s.v * dt;
    if (Math.abs(target - s.t) > 0.001 || Math.abs(s.v) > 0.001) busy = true; else { s.t = target; s.v = 0; }
    draw(s);
  }
  running = busy;
  if (busy) requestAnimationFrame(animate);
}

function paint() {
  for (const s of stations) {
    s.el.querySelector("ul").innerHTML =
      `<li class="temp">${s.room.temp.toFixed(1)}°, wanting ${s.room.target}°</li>` +
      s.room.devices.map((d) => `<li class="${d.on ? "on" : ""}" data-id="${d.id}">${d.name}: ${House.state(d)}</li>`).join("");
  }
  if (!running) { running = true; requestAnimationFrame(animate); }
}

// ---------- scenes: bell-pulls ----------
document.getElementById("cords").innerHTML =
  House.scenes.map((s) => `<button class="cord" data-scene="${s.id}"><span>${s.name}</span></button>`).join("");
document.getElementById("cords").onclick = (e) => {
  const cord = e.target.closest(".cord");
  if (!cord) return;
  cord.classList.remove("pulled"); void cord.offsetWidth; cord.classList.add("pulled");
  House.scene(cord.dataset.scene);
};

// Line boil: redraw the wobble a few times a second, as a hand-drawn film does.
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  let seed = 4;
  setInterval(() => document.getElementById("boil").setAttribute("seed", (seed = 4 + ((seed - 3) % 3))), 260);
}

House.on(paint);
stations.forEach(draw);
paint();
stations[0].el.querySelector(".detail").classList.add("open");
</script>
</body>
</html>
