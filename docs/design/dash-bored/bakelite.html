<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bakelite</title>
<style>
:root { --cream: #e9dfc3; --bake: #3a2117; --bake2: #1c0f0a; --brass: #c9a24b; --panel: #6f7f72; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: "Gill Sans", "Gill Sans MT", "Futura", sans-serif; color: var(--cream); padding: 18px 22px;
  /* Hammer-finish enamel: the grey-green of a 1950s instrument panel. */
  background: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1.6px) 0 0 / 5px 5px, linear-gradient(160deg, #7d8d80, #55645a); }
.top { display: grid; grid-template-columns: repeat(3, 200px) 1fr; gap: 18px; align-items: end; margin-bottom: 16px; }
.rooms { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.room { background: linear-gradient(170deg, #4a2a1d, var(--bake2)); border-radius: 14px; padding: 10px 10px 14px; text-align: center;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.15), inset 0 -4px 8px rgba(0,0,0,.5), 0 8px 14px rgba(0,0,0,.35); }
/* Traffolyte: engraved labels, white letters cut through black laminate. */
.label { display: inline-block; background: #111; color: #f4f0e4; font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 2px; box-shadow: 0 0 0 1px #777, 0 1px 2px #000; white-space: nowrap; }
svg { display: block; margin: 0 auto; overflow: visible; }

/* ---------- moving-coil meters ---------- */
.meter { background: linear-gradient(170deg, #2b1811, #120906); border-radius: 12px 12px 40px 40px; padding: 8px 8px 10px; text-align: center;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.14), 0 8px 14px rgba(0,0,0,.4); }
.meter svg { width: 100%; height: auto; margin-bottom: 6px; }
.face { fill: #efe6c8; } .scale { fill: none; stroke: #2a1a10; stroke-width: 1.2; } .needle { stroke: #151515; stroke-width: 1.6; stroke-linecap: round; }
.meter text, .room text { fill: #2a1a10; font-size: 8px; text-anchor: middle; letter-spacing: .08em; }

/* ---------- valves ---------- */
.valve .heater { opacity: calc(.12 + var(--heat, 0) * .88); transition: opacity 1.4s; }
.valve .halo { opacity: var(--heat, 0); transition: opacity 1.4s; animation: flicker 3.1s ease-in-out infinite; }
@keyframes flicker { 0%, 100% { scale: 1; } 40% { scale: 1.06; } 43% { scale: .97; } 70% { scale: 1.03; } }
.halo { transform-box: fill-box; transform-origin: center; }

/* ---------- the dimmer: a big fluted knob over an engraved scale ---------- */
.dimmer { position: relative; width: 104px; height: 104px; margin: 8px auto 6px; }
.dimmer svg { position: absolute; inset: 0; }
.knob { position: absolute; inset: 20px; border-radius: 50%; cursor: ns-resize; touch-action: none;
  background: repeating-conic-gradient(#1a1a1a 0 9deg, #333 9deg 18deg); box-shadow: 0 5px 8px rgba(0,0,0,.6), inset 0 0 0 9px #161616, inset 0 2px 0 9px #444;
  rotate: calc(-135deg + var(--lvl, 0) * 2.7deg); transition: rotate .3s; }
.knob.drag { transition: none; }
.knob::after { content: ""; position: absolute; left: 50%; top: -6px; margin-left: -3px; border: 3px solid transparent; border-bottom: 12px solid #f4f0e4; }

/* ---------- dolly switches: a stepped round base, a dome with a slot, a lever in the slot ---------- */
.dollies { display: flex; justify-content: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.dolly { all: unset; cursor: pointer; width: 60px; text-align: center; }
.dolly svg { width: 60px; height: 70px; filter: drop-shadow(0 4px 4px rgba(0,0,0,.55)); }
.dolly .label { font-size: 8px; letter-spacing: .1em; padding: 2px 5px; }
/* The lever rocks through the slot: up is off, down is on, as on a British wall. */
.dolly .lever { transform-origin: 32px 32px; transition: transform .1s cubic-bezier(.5, 0, 1, .5); }
.dolly.on .lever { transform: scaleY(-1); }
.dolly .pilot { fill: #4a1410; transition: fill .15s; }
.dolly.on .pilot { fill: #ff5a3c; filter: drop-shadow(0 0 4px #ff5a3c); }
.dolly:focus-visible svg { outline: 2px solid var(--cream); border-radius: 8px; }

/* ---------- knife switches: scenes ---------- */
.knives { display: flex; gap: 14px; justify-content: space-around; align-items: flex-end; justify-self: end; padding: 12px 18px 10px;
  background: linear-gradient(170deg, #2b1811, #120906); border-radius: 12px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.14), 0 8px 14px rgba(0,0,0,.4); }
.knife { all: unset; cursor: pointer; text-align: center; }
.knife svg { width: 130px; height: 84px; margin-bottom: 4px; }
.blade { transform-origin: 22px 60px; rotate: -52deg; transition: rotate .16s cubic-bezier(.5, 0, 1, .6); }
.knife.closed .blade { rotate: 0deg; transition: rotate .1s cubic-bezier(.6, 0, 1, 1); }
.spark { opacity: 0; } .knife.closed .spark { animation: spark .35s ease-out; }
@keyframes spark { 10% { opacity: 1; } 100% { opacity: 0; scale: 2; } }
.spark { transform-box: fill-box; transform-origin: center; }
.knife:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .valve .halo { animation: none; } }
@media (max-width: 900px) { .top { grid-template-columns: 1fr 1fr; } .rooms { grid-template-columns: 1fr 1fr; } .knives { grid-column: 1 / -1; flex-wrap: wrap; justify-content: center; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <radialGradient id="glass" cx=".35" cy=".25"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".4" stop-color="#bcd" stop-opacity=".12"/><stop offset="1" stop-color="#234" stop-opacity=".35"/></radialGradient>
  <radialGradient id="hot"><stop offset="0" stop-color="#fff2b0"/><stop offset=".4" stop-color="#ff8a1e"/><stop offset="1" stop-color="#ff4a00" stop-opacity="0"/></radialGradient>
  <radialGradient id="bake" cx=".32" cy=".25"><stop offset="0" stop-color="#6a3f2c"/><stop offset=".5" stop-color="#34190f"/><stop offset="1" stop-color="#150a06"/></radialGradient>
  <radialGradient id="dome" cx=".35" cy=".28"><stop offset="0" stop-color="#8a5740"/><stop offset=".55" stop-color="#3a1d12"/><stop offset="1" stop-color="#1a0c07"/></radialGradient>
  <linearGradient id="lever" x1="0" x2="1"><stop offset="0" stop-color="#b98a6c"/><stop offset=".4" stop-color="#6a3f2c"/><stop offset="1" stop-color="#2a140c"/></linearGradient>
  <radialGradient id="eye"><stop offset="0" stop-color="#062"/><stop offset=".6" stop-color="#3f6"/><stop offset="1" stop-color="#bfb"/></radialGradient>
</defs></svg>

<div class="top" id="top"><div class="knives" id="knives"></div></div>
<div class="rooms" id="rooms"></div>

<script src="house.js"></script>
<script>
const pt = (r, deg) => { const a = (deg - 90) * Math.PI / 180; return `${(60 + r * Math.cos(a)).toFixed(1)},${(66 + r * Math.sin(a)).toFixed(1)}`; };
const needles = [];   // every pointer: where it is, how fast it is moving and where it is being pulled

// A moving-coil meter with a scale from `lo` to `hi`. `read` gives the value it should show.
function meter(title, lo, hi, read, unit) {
  const marks = Array.from({ length: 11 }, (_, i) => {
    const deg = -50 + i * 10;
    return `<path class="scale" d="M${pt(46, deg)} L${pt(i % 5 ? 50 : 54, deg)}"/>` + (i % 5 ? "" : `<text x="${pt(38, deg).split(",")[0]}" y="${+pt(38, deg).split(",")[1] + 3}">${Math.round(lo + (hi - lo) * i / 10)}</text>`);
  }).join("");
  const el = document.createElement("div");
  el.innerHTML = `<svg viewBox="0 0 120 76"><rect class="face" x="2" y="2" width="116" height="72" rx="6"/>
    <path class="scale" d="M${pt(46, -50)} A46,46 0 0 1 ${pt(46, 50)}"/>${marks}<text x="60" y="52">${unit}</text>
    <line class="needle" x1="60" y1="66" x2="60" y2="16"/><path d="M40,74 a20,20 0 0 1 40,0 z" fill="#1c0f0a"/></svg><span class="label">${title}</span>`;
  needles.push({ line: el.querySelector(".needle"), read, lo, hi, at: -50, v: 0 });
  return el;
}

// ---------- the top row ----------
const header = document.getElementById("top"), knives = document.getElementById("knives");
[["Mains draw", 0, 3, () => House.watts() / 1000, "kW"], ["Accumulator", 0, 100, () => House.energy.battery, "%"],
 ["Outside air", -10, 30, () => House.rooms[5].temp, "°C"]].forEach((m) => { const el = meter(...m); el.className = "meter"; header.insertBefore(el, knives); });

knives.innerHTML = House.scenes.map((s) => `<button class="knife" data-scene="${s.id}">
  <svg viewBox="0 0 130 84"><rect x="4" y="62" width="122" height="18" rx="3" fill="#3c4142" stroke="#111"/>
    <path d="M100,62 v-16 M108,62 v-16" stroke="#c9a24b" stroke-width="4"/><path d="M18,62 v-8 h8 v8" fill="#c9a24b"/>
    <circle class="spark" cx="104" cy="46" r="7" fill="url(#hot)"/>
    <g class="blade"><rect x="18" y="56" width="92" height="7" rx="2" fill="#d6a45a" stroke="#7a5c1e"/><rect x="104" y="42" width="12" height="26" rx="5" fill="#1c0f0a"/></g>
    <circle cx="22" cy="60" r="4" fill="#7a5c1e"/></svg><span class="label">${s.name}</span></button>`).join("");
knives.onclick = (e) => {
  const k = e.target.closest(".knife");
  if (!k) return;
  document.querySelectorAll(".knife").forEach((x) => x.classList.toggle("closed", x === k));
  House.scene(k.dataset.scene);
};

// The switch, drawn after a 1950s surface-mounted tumbler switch.
const DOLLY = `<svg viewBox="0 -8 64 74"><circle class="pilot" cx="32" cy="-3" r="3.6" stroke="#c9a24b" stroke-width="1.2"/>
  <circle cx="32" cy="34" r="30" fill="#0e0705"/><circle cx="32" cy="32" r="30" fill="url(#bake)"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#fff" stroke-opacity=".16"/><circle cx="32" cy="32" r="23.5" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="1.6"/>
  <g fill="#8a8473" stroke="#2a1a10" stroke-width=".8"><circle cx="9.5" cy="45" r="3"/><circle cx="54.5" cy="19" r="3"/></g>
  <path d="M7.4,43.6 l4.2,2.8 M52.4,20.4 l4.2,-2.8" stroke="#2a1a10" stroke-width="1.1"/>
  <circle cx="32" cy="32" r="19" fill="url(#dome)"/><rect x="25" y="19" width="14" height="26" rx="3" fill="#050201" stroke="#9a6a50" stroke-opacity=".5" stroke-width=".8"/>
  <g class="lever"><path d="M26.5,34 L28,9 Q32,5 36,9 L37.5,34 Z" fill="url(#lever)" stroke="#060302" stroke-width=".8"/>
    <path d="M30,11 L29.2,31" stroke="#fff" stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round"/></g>
  <ellipse cx="24" cy="23" rx="5" ry="3" fill="#fff" opacity=".22" transform="rotate(-35 24 23)"/></svg>`;

// ---------- one chassis per room ----------
House.rooms.forEach((room) => {
  const lamp = House.lights(room)[0], el = document.createElement("section");
  el.className = "room"; el.dataset.room = room.id;
  el.innerHTML = `<svg class="valve" viewBox="0 0 80 96" width="74">
      <ellipse class="halo" cx="40" cy="48" rx="34" ry="40" fill="url(#hot)"/>
      <rect x="22" y="80" width="36" height="14" rx="2" fill="#1c0f0a"/><path d="M28,94 v6 M36,94 v6 M44,94 v6 M52,94 v6" stroke="#bbb" stroke-width="2"/>
      <rect x="29" y="30" width="22" height="42" rx="2" fill="#555" stroke="#222"/><path d="M33,34 v34 M40,34 v34 M47,34 v34" stroke="#2a2a2a"/>
      <ellipse class="heater" cx="40" cy="52" rx="7" ry="20" fill="url(#hot)"/>
      <path d="M22,82 V30 Q22,8 38,6 L40,1 L42,6 Q58,8 58,30 V82 Z" fill="url(#glass)" stroke="#dfe8ee" stroke-opacity=".6"/>
      <ellipse cx="40" cy="14" rx="12" ry="5" fill="#333" opacity=".55"/></svg>
    <span class="label">${room.name}</span>
    <div style="margin:8px 6px 0" data-meter></div>
    <div class="dimmer"><svg viewBox="0 0 104 104">${Array.from({ length: 11 }, (_, i) => {
        const a = (-135 + i * 27 - 90) * Math.PI / 180;
        return `<line x1="${52 + 40 * Math.cos(a)}" y1="${52 + 40 * Math.sin(a)}" x2="${52 + 47 * Math.cos(a)}" y2="${52 + 47 * Math.sin(a)}" stroke="#e9dfc3" stroke-width="${i % 5 ? 1 : 2.2}"/>`;
      }).join("")}</svg><div class="knob" data-id="${lamp.id}" role="slider" aria-label="${lamp.name} dimmer" tabindex="0"></div></div>
    <span class="label">${lamp.name}</span>
    <div class="dollies">${room.devices.filter((d) => d !== lamp).map((d) => `<button class="dolly" data-id="${d.id}" aria-label="${d.name}">${DOLLY}<span class="label">${d.name.split(" ")[0].slice(0, 7)}</span></button>`).join("")}</div>`;
  const m = meter(`${room.temp.toFixed(1)}°`, 5, 25, () => room.temp, "°C");
  el.querySelector("[data-meter]").replaceWith(m);
  m.style.margin = "8px 6px 0"; m.querySelector(".face").style.fill = "#f2ead0";
  document.getElementById("rooms").append(el);
});

document.getElementById("rooms").addEventListener("click", (e) => { const d = e.target.closest(".dolly"); if (d) House.toggle(d.dataset.id); });
document.getElementById("rooms").addEventListener("pointerdown", (e) => {
  const knob = e.target.closest(".knob");
  if (!knob) return;
  const d = House.find(knob.dataset.id), from = d.on ? d.level : 0, y0 = e.clientY;
  knob.setPointerCapture(e.pointerId); knob.classList.add("drag");
  knob.onpointermove = (ev) => House.set(d.id, Math.max(0, Math.min(100, from + (y0 - ev.clientY) * 0.8)));
  knob.onpointerup = () => { knob.onpointermove = null; knob.classList.remove("drag"); };
});
document.getElementById("rooms").addEventListener("keydown", (e) => {
  const step = { ArrowUp: 10, ArrowDown: -10 }[e.key];
  if (step && e.target.matches(".knob")) { const d = House.find(e.target.dataset.id); House.set(d.id, Math.max(0, Math.min(100, (d.on ? d.level : 0) + step))); }
});

function paint() {
  for (const room of House.rooms) {
    const lights = House.lights(room), heat = lights.reduce((s, d) => s + (d.on ? d.level : 0), 0) / (lights.length * 100);
    document.querySelector(`[data-room="${room.id}"] .valve`).style.setProperty("--heat", heat ? 0.35 + heat * 0.65 : 0);
  }
  for (const d of House.devices) {
    const el = document.querySelector(`[data-id="${d.id}"]`);
    el.classList.toggle("on", d.on);
    el.style.setProperty("--lvl", d.on ? d.level : 0);
  }
}

// The pointers are never quite still: each hangs on a weak spring, is nudged at random
// (mains hum, a passing lorry) and overshoots when its reading changes.
function shake() {
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  for (const n of needles) {
    const want = -50 + 100 * Math.max(0, Math.min(1, (n.read() - n.lo) / (n.hi - n.lo)));
    n.v += (want - n.at) * 0.035 - n.v * 0.09 + (still ? 0 : (Math.random() - 0.5) * 0.5);
    n.at += n.v;
    n.line.setAttribute("transform", `rotate(${n.at.toFixed(2)} 60 66)`);
  }
  requestAnimationFrame(shake);
}

House.on(paint);
paint(); requestAnimationFrame(shake);
</script>
</body>
</html>
