<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nixie</title>
<style>
/* The Console's 1960s: a rack of test instruments. Blue-grey plates on a wrinkle-finish
   frame, engraved legends filled white, clear-fronted meters, nixie tubes, a magic eye. */
body { background: #23282c; }
.panel { min-height: 100vh; padding: 16px 20px; color: #f3f1e6; font-family: "Gill Sans", "Gill Sans MT", "Helvetica Neue", sans-serif;
  background: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.7px) 0 0 / 4px 4px, radial-gradient(rgba(0,0,0,.2) 1px, transparent 1.7px) 2px 2px / 4px 4px, linear-gradient(170deg, #4c5961, #333d44); }
.bay { border-radius: 3px; background: linear-gradient(175deg, #8ba4b0, #6f8996); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(0,0,0,.3), 0 3px 6px rgba(0,0,0,.5); }
/* A screw in each top corner of a plate. */
.bay::before, .bay::after { content: ""; position: absolute; top: 3px; width: 8px; height: 8px; background: linear-gradient(45deg, transparent 44%, #333 44% 56%, transparent 56%), radial-gradient(circle, #d5d9dc 0 3px, #4a5257 3.2px 3.8px, transparent 4px); }
.bay::before { left: 3px; } .bay::after { right: 3px; }
.label { margin-top: 5px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; text-shadow: 0 1px 0 rgba(0,0,0,.45); }
.head .label { margin: 0; font-size: 12px; }

/* A clear-fronted meter: a cream face under perspex, a fine black needle. */
.needle-m { --wob: .75; --needle: #17191b; --needle-w: .45; }
.win { border: 4px solid #17191b; border-radius: 5px; box-shadow: 0 3px 5px rgba(0,0,0,.45); }
.needle-m .win { background: linear-gradient(#fbf8ec, #ebe6d2); }
.needle-m .win::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.6) 0 10%, transparent 28%); }
.arc, .tick { fill: none; stroke: #17191b; stroke-width: .5; } .red { fill: none; stroke: #c2281c; stroke-width: 1.6; }
.face text { fill: #17191b; font-size: 6px; } .face .unit { font-size: 6.5px; }
.cowl { height: 13%; background: #17191b; }
/* The same reading in nixie tubes. A tube holds all ten figures, each a cathode of bent
   wire, stacked one behind another; the one that is lit glows, and the wires of those in
   front of it cross it as fine dark lines. A mesh, the anode, is in front of them all. */
.display-m .win { --fig: 36px; background: #140a06; } .display-m .unit { align-self: flex-end; margin-bottom: 14px; color: #c9b9a6; font-size: 10px; } .sweep { display: none; }
.figs { gap: 2px; }
.nix { position: relative; display: inline-block; width: .9em; height: 1.45em; overflow: hidden; border: 1px solid rgba(255,255,255,.28); border-radius: .45em .45em .12em .12em;
  background: linear-gradient(90deg, rgba(255,255,255,.2), transparent 25% 75%, rgba(255,255,255,.1)), #140a06; }
.nix.on { background: radial-gradient(ellipse at 50% 55%, rgba(255,120,30,.3), transparent 72%), linear-gradient(90deg, rgba(255,255,255,.2), transparent 25% 75%, rgba(255,255,255,.1)), #140a06; }
/* Each figure sits a little to one side of the one behind it, as the stack is seen from in front. */
.nix b { position: absolute; inset: 0; display: grid; place-items: center; color: transparent; font: 200 1em/1 "Helvetica Neue", "Avenir Next", sans-serif; -webkit-text-stroke: .35px rgba(178,160,146,.2); transform: translateX(calc((var(--z) - 4.5) * .016em)); }
.nix b.lit { color: #ffb05a; font-weight: 300; -webkit-text-stroke: .5px #ffd9a8; text-shadow: 0 0 .12em #ff7a10, 0 0 .4em #ff5a00; }
.nix b.lit ~ b { -webkit-text-stroke: .35px rgba(60,24,8,.38); }
.nix u { position: absolute; right: .1em; bottom: .16em; width: .1em; height: .1em; border-radius: 50%; background: rgba(178,160,146,.3); } .nix u.lit { background: #ffb866; box-shadow: 0 0 .25em #ff6a00; }
.nix::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(60deg, rgba(0,0,0,.2) 0 .5px, transparent .5px 3.5px), repeating-linear-gradient(-60deg, rgba(0,0,0,.2) 0 .5px, transparent .5px 3.5px); }
.dial .figs { --fig: 24px; margin-top: 6px; padding: 2px 3px; border-radius: 3px; background: #17191b; }

/* A magic eye: two green bars that close on each other as the room's lights come up. */
.eye { position: relative; width: 66px; height: 20px; overflow: hidden; border: 2px solid #17191b; border-radius: 10px; background: #07140b; box-shadow: inset 0 0 6px #000, 0 1px 0 rgba(255,255,255,.3); }
.eye i { position: absolute; top: 2px; bottom: 2px; width: calc(6% + var(--frac, 0) * 44%); opacity: calc(.3 + var(--frac, 0) * .7); background: linear-gradient(#b8ffcf, #35e36f 40%, #0c9a3e); box-shadow: 0 0 8px #3dff7d; transition: width 1s, opacity 1s; }
.eye i:first-child { left: 0; } .eye i:last-child { right: 0; }

/* An instrument knob: a fluted grip on a pale skirt with an index line, over an engraved scale. */
.crank { width: 74px; height: 74px; margin: 10px auto 4px; border-radius: 50%; }
.crank::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; background: repeating-conic-gradient(from 224.5deg, #f3f1e6 0 1deg, transparent 1deg 27deg);
  -webkit-mask: radial-gradient(circle, transparent 0 60%, #000 61% 70%, transparent 71%), conic-gradient(from 224deg, #000 0 272deg, transparent 272deg); -webkit-mask-composite: source-in; mask-composite: intersect; }
.turn { inset: 14px; background: radial-gradient(circle, #4d5459 0 17%, transparent 18%), repeating-conic-gradient(#15181a 0 8deg, #3d444a 8deg 16deg); box-shadow: 0 0 0 9px #c9ced2, 0 0 0 10px #555c61; z-index: 1; }
/* The light does not turn with a knob: its shadow, and the shine on it, are on a layer under the part that turns. */
.crank::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; box-shadow: 0 6px 9px rgba(0,0,0,.5); }
.turn::after { content: ""; position: absolute; left: 50%; top: -9px; width: 2px; height: 9px; margin-left: -1px; background: #17191b; }
.crank.heat .turn { background: radial-gradient(circle, #b3261b 0 17%, transparent 18%), repeating-conic-gradient(#15181a 0 8deg, #3d444a 8deg 16deg); }

/* A lever key, as a telephone exchange's: a black handle in a chrome plate, under a neon pilot. Down is on. */
.sw svg { display: block; width: 44px; margin-top: 8px; }
.lever { transform-origin: 22px 39px; transition: transform .1s cubic-bezier(.5, 0, 1, .5); } .on .lever { transform: scaleY(-1); }
.pilot { fill: #5a2a10; transition: fill .15s; } .on .pilot { fill: #ffb070; } .glow { opacity: 0; transition: opacity .15s; } .on .glow { opacity: .4; }
/* Its guard: a red cover hinged at the top, lifted by the first press. */
.guard { position: absolute; left: 5px; right: 5px; top: 27px; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, rgba(160,15,12,.94), rgba(238,62,50,.88) 40%, rgba(140,10,10,.94)); box-shadow: 0 2px 3px rgba(0,0,0,.5); transform-origin: top; transition: transform .18s; }
.up .guard { transform: scaleY(.12); }

/* Scenes: large round pushes, lit from behind for the one that was pressed. */
.cap { display: grid; place-items: center; width: 54px; height: 54px; border: 3px solid #17191b; border-radius: 50%; color: #222; font-size: 8px; letter-spacing: .06em; text-transform: uppercase;
  background: radial-gradient(circle at 35% 30%, #fffdf2, #d2ccb6 70%); box-shadow: 0 0 0 2px #b9bec2, 0 4px 6px rgba(0,0,0,.5); }
.closed .cap { background: radial-gradient(circle at 40% 35%, #fff6c9, #ffb53c 75%); box-shadow: 0 0 0 2px #b9bec2, 0 0 16px #ffad33; }

/* Alerts: a neon lamp, and what is wrong on a strip torn from the teleprinter. */
.alert { display: flex; align-items: center; gap: 9px; }
.lamp { flex: none; width: 12px; height: 20px; border-radius: 6px; background: radial-gradient(ellipse at 50% 40%, #ffe2b0, #ff6a1e 60%, #a32c00); box-shadow: 0 0 10px #ff6a1e; }
.critical .lamp { animation: blink 1s steps(2, jump-none) infinite; } @keyframes blink { 0% { opacity: .35; } }
.msg { padding: 3px 16px 3px 8px; background: #f2ecd9; color: #222; font: 12px/1.3 "Courier New", monospace; text-transform: uppercase; transform: rotate(-.4deg);
  clip-path: polygon(0 0, 100% 0, calc(100% - 4px) 25%, 100% 50%, calc(100% - 4px) 75%, 100% 100%, 0 100%); }
.alert:nth-child(2) .msg { transform: rotate(.3deg); }

/* A black-and-white tube, its glass bulging at the corners. */
.tube { overflow: hidden; border: 6px solid #17191b; border-radius: 24px / 20px; background: #000; }
.tube svg { filter: grayscale(1) contrast(1.2) brightness(1.1); }
.tube::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px), radial-gradient(ellipse, rgba(140,170,255,.1) 40%, rgba(0,0,0,.6)); }

/* Thumbwheels, white on black, and clear-capped keys. */
.wheel { width: 24px; margin: 0 1px; border: 1px solid #444; border-radius: 2px; background: #0c0c0c; } .wheel button { width: 100%; height: 14px; color: #888; font-size: 7px; }
.num { width: 100%; height: 22px; background: linear-gradient(#1b1b1b, #383838 50%, #1b1b1b); color: #f4f1e6; font: 600 15px/22px "Helvetica Neue", sans-serif; text-align: center; }
.key { display: block; width: 30px; height: 30px; margin: 0 auto; border: 2px solid #17191b; border-radius: 3px; background: linear-gradient(160deg, rgba(255,255,255,.8), rgba(215,222,226,.5)); box-shadow: 0 3px 4px rgba(0,0,0,.5); }

/* The chart: a trace on an oscilloscope's green phosphor, behind its graticule. */
.chart { overflow: hidden; border: 6px solid #17191b; border-radius: 16px / 13px; background: radial-gradient(ellipse, #0a2413, #030b06); }
.grid line { stroke: rgba(110,255,160,.22); stroke-width: .4; } .trace, .halo { fill: none; stroke: #8dffb0; stroke-width: 1.1; } .halo { stroke-width: 4; opacity: .22; }
@media (prefers-reduced-motion: reduce) { .critical .lamp { animation: none; } }
</style>
</head>
<body>
<script src="house.js"></script>
<script src="eras.js"></script>
<script>
Era({
  meters: "display",
  // A tube for each figure of a reading, the point in the tube of the figure before it. The
  // figures are stacked in the order of a common tube, from the back (1) to the front (6);
  // a tube with nothing lit still shows them all.
  figs: (text) => [...text.replace(/[°%]/g, "")].map((ch, i, all) => (ch === "." ? "" : `<i class="nix${ch === " " ? "" : " on"}">${[..."1029348576"].map((n, z) => `<b style="--z:${z}"${n === ch ? ` class="lit"` : ""}>${n}</b>`).join("")}<u${all[i + 1] === "." ? ` class="lit"` : ""}></u></i>`)).join(""),
  lights: (r) => `<div class="lights eye" data-lights="${r.id}"><i></i><i></i></div>`,
  key: `<svg viewBox="0 0 44 66"><circle class="glow" cx="22" cy="6" r="9" fill="#ff7a2a"/><circle class="pilot" cx="22" cy="6" r="4.2" stroke="#17191b"/>
    <rect x="8" y="16" width="28" height="48" rx="3" fill="#cfd3d6" stroke="#4a5257"/><path d="M10,18 h24" stroke="#fff" stroke-opacity=".7"/>
    <circle cx="13" cy="21" r="1.6" fill="#6d757a"/><circle cx="31" cy="59" r="1.6" fill="#6d757a"/><rect x="18" y="24" width="8" height="30" rx="4" fill="#0b0b0b"/>
    <g class="lever"><path d="M19.5,40 L18,21 Q18,12 22,12 Q26,12 26,21 L24.5,40 Z" fill="#141414" stroke="#000" stroke-width=".7"/><path d="M20.3,16 L20.8,36" stroke="#fff" stroke-opacity=".3" stroke-width="1.4" stroke-linecap="round"/></g></svg>`,
});
</script>
</body>
</html>
